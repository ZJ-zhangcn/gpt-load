name: Build and Publish Docker Image

on:
  # personal is the fork's deployment branch; every update publishes a fresh image.
  push:
    branches:
      - personal
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve merged upstream version
        id: upstream-version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force https://github.com/tbphp/gpt-load.git \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/tags/v*:refs/tags/v*'
          upstream_version=""
          while IFS= read -r tag; do
            if git merge-base --is-ancestor "$tag" upstream/main; then
              upstream_version="$tag"
              break
            fi
          done < <(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname)
          test -n "$upstream_version"
          printf 'version=%s\n' "$upstream_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            # This workflow only runs on the personal deployment branch, so latest must not depend on stale event default-branch metadata.
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            UPSTREAM_VERSION=${{ steps.upstream-version.outputs.version }}
